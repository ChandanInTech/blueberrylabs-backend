name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: social_resizer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d social_resizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test harness creates and drops its own per-run database, so it needs
      # an admin connection rather than the pre-created test database.
      TEST_ADMIN_DATABASE_URL: postgresql://app:app@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile (native Sharp libs, missing files) before
      # Railway attempts the same build.
      - name: Build image
        run: docker build -t blueberrylabs-backend:ci .
