# Railway build/deploy configuration.
#
# Kept alongside railway.json because `railway up` (directory upload) reads the
# TOML form reliably, while repo-connected services read railway.json.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
